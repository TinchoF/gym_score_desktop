appId: ar.com.gymscore.desktop
productName: GymScore Modo Sede
directories:
  output: release
  buildResources: build   # build/icon.png → electron-builder genera el .icns
files:
  - dist/**/*
  - renderer/**/*
  - package.json
extraResources:
  - from: resources/backend
    to: backend
  - from: resources/frontend
    to: frontend
afterSign: build/afterSign.js
mac:
  target: dmg
  category: public.app-category.sports
  # sin identidad de Apple Developer (sin notarizar) — ver docs/MODO_SEDE.md.
  # afterSign.js igual la firma ad-hoc: sin eso, arm64 sin NINGUNA firma no arranca
  # ("está dañado y no puede abrirse" en vez del aviso de desarrollador no identificado).
  identity: null
  # nombre fijo (sin versión) para que el link de descarga no cambie con cada release
  artifactName: "GymScore-Modo-Sede.dmg"
